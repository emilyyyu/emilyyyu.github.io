<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-labelledby="title desc">
  <title id="title">VAISS</title>
  <desc id="desc">An editorial-style VAISS wordmark with offset print colors, a technical grid, and a logic circuit motif.</desc>

  <defs>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#17213f" stroke-width="1" opacity="0.18"/>
    </pattern>
    <clipPath id="cyan-slice">
      <rect x="40" y="56" width="344" height="18"/>
      <rect x="40" y="112" width="344" height="12"/>
    </clipPath>
    <clipPath id="pink-slice">
      <rect x="40" y="78" width="344" height="13"/>
      <rect x="40" y="128" width="344" height="8"/>
    </clipPath>
  </defs>

  <path d="M17 18H542V145H34l-17-17Z" fill="#f4f0e7" stroke="#17213f" stroke-width="3"/>
  <path d="M29 30H550V153H29Z" fill="url(#grid)" stroke="#12cfe2" stroke-width="3" opacity="0.92"/>
  <path d="M17 39V18h21M521 18h21v21M17 124v21h21M521 145h21v-21" fill="none" stroke="#ef3e92" stroke-width="4"/>

  <rect x="44" y="45" width="326" height="94" fill="#f4f0e7" stroke="#17213f" stroke-width="3"/>
  <text x="50" y="120" fill="#12cfe2" clip-path="url(#cyan-slice)" font-family="Impact, Arial, sans-serif" font-size="94" letter-spacing="5">VAISS</text>
  <text x="60" y="124" fill="#ef3e92" clip-path="url(#pink-slice)" font-family="Impact, Arial, sans-serif" font-size="94" letter-spacing="5">VAISS</text>
  <text x="55" y="121" fill="#17213f" font-family="Impact, Arial, sans-serif" font-size="94" letter-spacing="5">VAISS</text>

  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <circle cx="392" cy="63" r="6" fill="#b7ef3b" stroke="#17213f" stroke-width="3"/>
    <circle cx="392" cy="116" r="6" fill="#ef3e92" stroke="#17213f" stroke-width="3"/>
    <path d="M398 63h24v18h24M398 116h24V98h24" stroke="#17213f" stroke-width="5"/>
    <rect x="446" y="70" width="40" height="40" fill="#f4f0e7" stroke="#12cfe2" stroke-width="5"/>
    <rect x="452" y="64" width="40" height="40" stroke="#ef3e92" stroke-width="3"/>
    <path d="M486 90h26v-25h20M512 90v28h20" stroke="#17213f" stroke-width="5"/>
    <circle cx="532" cy="65" r="6" fill="#b7ef3b" stroke="#17213f" stroke-width="3"/>
    <circle cx="532" cy="118" r="6" fill="#12cfe2" stroke="#17213f" stroke-width="3"/>
    <path d="m455 87 9 10 18-23" stroke="#b7ef3b" stroke-width="7"/>
  </g>

  <path d="M382 32v12M390 32v12M398 32v12M406 32v12" stroke="#ef3e92" stroke-width="3"/>
  <path d="M378 137h44" stroke="#12cfe2" stroke-width="5"/>
</svg>
