<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-labelledby="title desc">
  <title id="title">Veritas Lab wordmark</title>
  <desc id="desc">An editorial-style Veritas Lab wordmark with a geometric V, verification check, technical grid, and cyan and magenta print offsets.</desc>

  <defs>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#17213f" stroke-width="1" opacity="0.2"/>
    </pattern>
    <clipPath id="cyan-slice">
      <rect x="164" y="67" width="486" height="18"/>
      <rect x="164" y="118" width="486" height="12"/>
    </clipPath>
    <clipPath id="pink-slice">
      <rect x="164" y="88" width="486" height="15"/>
      <rect x="164" y="137" width="486" height="8"/>
    </clipPath>
  </defs>

  <rect x="17" y="16" width="142" height="142" fill="#f4f0e7" stroke="#17213f" stroke-width="3"/>
  <rect x="28" y="28" width="142" height="142" fill="url(#grid)" stroke="#12cfe2" stroke-width="4"/>
  <path d="M17 34V16h18M141 16h18v18M17 140v18h18M141 158h18v-18" fill="none" stroke="#ef3e92" stroke-width="4"/>

  <path d="M48 51h29l23 66 23-66h29l-39 97H87Z" fill="#ef3e92" opacity="0.92" transform="translate(5 3)"/>
  <path d="M48 51h29l23 66 23-66h29l-39 97H87Z" fill="#17213f"/>
  <path d="m65 93 24 25 51-61" fill="none" stroke="#b7ef3b" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
  <circle cx="37" cy="147" r="5" fill="#ef3e92"/>
  <circle cx="150" cy="39" r="5" fill="#12cfe2"/>

  <path d="M178 34H664V156H178l-12-12V46Z" fill="#f4f0e7" stroke="#17213f" stroke-width="3"/>
  <path d="M180 48H650M180 143H650" fill="none" stroke="#17213f" stroke-width="1" opacity="0.22"/>

  <text x="187" y="122" fill="#12cfe2" clip-path="url(#cyan-slice)" font-family="Impact, Arial, sans-serif" font-size="82" letter-spacing="3">VERITAS</text>
  <text x="197" y="126" fill="#ef3e92" clip-path="url(#pink-slice)" font-family="Impact, Arial, sans-serif" font-size="82" letter-spacing="3">VERITAS</text>
  <text x="192" y="123" fill="#17213f" font-family="Impact, Arial, sans-serif" font-size="82" letter-spacing="3">VERITAS</text>

  <path d="M390 32v11M398 32v11M406 32v11M414 32v11" stroke="#ef3e92" stroke-width="3"/>
  <path d="M438 151h36" stroke="#12cfe2" stroke-width="5"/>
</svg>
